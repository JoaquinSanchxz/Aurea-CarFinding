name: Aurea Auto-Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:      # Allows manual execution

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install -e .

    - name: Run Aurea Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        .venv/bin/python -m aurea run

    - name: Commit and Push DB and Config Changes
      run: |
        git config --global user.name "Aurea Bot"
        git config --global user.email "aurea-bot@users.noreply.github.com"
        git add -f data/aurea.db config/searches.yaml || true
        git commit -m "chore: auto-update database and search settings [skip ci]" || true
        git push || true
