name: Aurea Auto-Monitor

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs every 2 hours
  workflow_dispatch:      # Allows manual execution

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run Aurea Monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python -m aurea run

    - name: Commit and Push DB Changes
      run: |
        git config --global user.name "Aurea Bot"
        git config --global user.email "aurea-bot@users.noreply.github.com"
        git add data/aurea.db || true
        git commit -m "chore: auto-update database [skip ci]" || true
        git push || true
